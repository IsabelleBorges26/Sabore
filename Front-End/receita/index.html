<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receita | Saboré</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <style>
    :root { color-scheme:dark; --bg:#0d211b; --card:#152c25; --line:rgba(243,239,222,.15); --ink:#f7f2e8; --muted:#b8c3ba; --accent:#ec8b7d; --green:#24d66f; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; font-size:13px; }
    main { width:min(700px,calc(100% - 40px)); margin:0 auto; } .site-header { height:70px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    .brand { color:var(--accent); font:1.45rem 'DM Serif Display',serif; text-decoration:none; } .enter { color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:10px 14px; text-decoration:none; font-weight:700; font-size:11px; }
    .body { padding:34px 0 30px; } .eyebrow { color:var(--accent); font-size:10px; font-weight:800; letter-spacing:.08em; } h1 { font:clamp(2.3rem,5vw,3.7rem)/1.02 'DM Serif Display',serif; margin:18px 0 14px; letter-spacing:-.025em; } .description { max-width:650px; color:var(--muted); line-height:1.55; margin:0 0 22px; }
    .author { display:flex; align-items:center; gap:10px; margin:18px 0; } .avatar { width:31px; height:31px; display:grid; place-items:center; border-radius:50%; background:#3a3530; color:var(--accent); font-weight:800; } .author strong { display:block; font-size:12px; } .author small { color:var(--muted); font-size:10px; }
    .meta,.tags,.actions { display:flex; gap:9px; flex-wrap:wrap; } .meta { margin:12px 0 20px; } .pill { border:1px solid var(--line); border-radius:999px; padding:6px 10px; color:var(--ink); font-size:10px; font-weight:700; } .tag { color:#ffd5ca; }
    .actions { margin-bottom:25px; } button { border:1px solid var(--line); border-radius:9px; padding:11px 15px; color:var(--ink); background:transparent; font:700 11px Inter,sans-serif; cursor:pointer; } .share { background:var(--accent); border-color:var(--accent); color:#13221d; } .whatsapp { background:var(--green); border-color:var(--green); color:#062817; }
    .columns { display:grid; grid-template-columns:.88fr 1.55fr; gap:16px; } section { border:1px solid var(--line); border-radius:14px; padding:20px; } h2 { font:1.2rem 'DM Serif Display',serif; margin:0 0 16px; } ol,ul { margin:0; padding-left:20px; color:var(--ink); line-height:1.65; } li { padding:5px 0 5px 3px; } li::marker { color:var(--accent); font-weight:800; }
    .hashtags { margin-top:15px; } .footer { border-top:1px solid var(--line); padding:27px 0 40px; text-align:center; color:var(--muted); font-size:11px; } .footer a { display:inline-block; margin-top:12px; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-weight:700; text-decoration:none; }
    .status { padding:70px 0; text-align:center; color:var(--muted); } @media(max-width:600px) { main { width:min(100% - 28px,700px); } .columns { grid-template-columns:1fr; } h1 { font-size:2.35rem; } .actions button { flex:1; padding-inline:8px; } }
  </style>
</head>
<body>
  <main>
    <header class="site-header"><a class="brand" href="../index.html">Saboré</a><a class="enter" href="../login/">Entrar no Saboré →</a></header>
    <article id="recipe"><div class="status">Carregando receita…</div></article>
  </main>
  <script>
    const recipeId = new URLSearchParams(location.search).get('id');
    const escapeHtml = (value) => String(value || '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
    const formatDate = (value) => value ? new Intl.DateTimeFormat('pt-BR', { day:'2-digit', month:'long', year:'numeric' }).format(new Date(value)) : 'hoje';
    const copyLink = async (url) => {
      try { await navigator.clipboard.writeText(url); alert('Link da receita copiado.'); }
      catch { prompt('Copie o link da receita:', url); }
    };
    const render = (recipe) => {
      document.title = `${recipe.title} | Saboré`;
      const url = location.href;
      const initial = escapeHtml((recipe.author || 'S').trim().charAt(0).toUpperCase());
      const hashtags = (recipe.hashtags || []).map(tag => `<span class="pill tag">${escapeHtml(tag)}</span>`).join('');
      const ingredients = (recipe.ingredients || []).map(item => `<li>${escapeHtml(item)}</li>`).join('') || '<li>Ingredientes não informados.</li>';
      const steps = (recipe.steps || []).map(item => `<li>${escapeHtml(item)}</li>`).join('') || '<li>Modo de preparo não informado.</li>';
      const ai = recipe.criadaPorIA ? '<span class="pill"><i class="fa-solid fa-wand-magic-sparkles"></i> Criada com IA</span>' : '';
      document.getElementById('recipe').innerHTML = `<div class="body"><div class="eyebrow"><i class="fa-solid fa-utensils"></i> DA COMUNIDADE SABORÉ</div><h1>${escapeHtml(recipe.title)}</h1><p class="description">${escapeHtml(recipe.description || 'Receita compartilhada pela comunidade Saboré.')}</p><div class="author"><span class="avatar">${initial}</span><div><strong>${escapeHtml(recipe.author || 'Comunidade Saboré')}</strong><small>Publicado em ${formatDate(recipe.publishedAt)}</small></div></div><div class="meta"><span class="pill"><i class="fa-regular fa-clock"></i> ${Number(recipe.time) || 0} min</span><span class="pill"><i class="fa-solid fa-gauge-high"></i> ${escapeHtml(recipe.difficulty || 'Fácil')}</span><span class="pill"><i class="fa-solid fa-tag"></i> ${escapeHtml(recipe.category || 'Geral')}</span>${ai}</div><div class="actions"><button class="share" id="share-recipe"><i class="fa-solid fa-share-nodes"></i> Compartilhar receita</button><button class="whatsapp" id="share-whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button><button id="copy-link"><i class="fa-regular fa-copy"></i> Copiar link</button></div><div class="columns"><section><h2><i class="fa-solid fa-basket-shopping"></i> Ingredientes</h2><ul>${ingredients}</ul></section><section><h2><i class="fa-solid fa-list-ol"></i> Modo de preparo</h2><ol>${steps}</ol></section></div>${hashtags ? `<div class="tags hashtags">${hashtags}</div>` : ''}</div><footer class="footer">Gostou da receita? Descubra novos sabores e compartilhe os seus.<br><a href="../Dashboard/explorar/">Conhecer a comunidade <i class="fa-solid fa-arrow-right"></i></a></footer>`;
      document.getElementById('copy-link').addEventListener('click', () => copyLink(url));
      document.getElementById('share-whatsapp').addEventListener('click', () => window.open(`https://wa.me/?text=${encodeURIComponent(`Veja a receita ${recipe.title} no Saboré: ${url}`)}`, '_blank', 'noopener,noreferrer'));
      document.getElementById('share-recipe').addEventListener('click', async () => {
        if (navigator.share) { try { await navigator.share({ title: recipe.title, text: recipe.description || recipe.title, url }); return; } catch (error) { if (error.name === 'AbortError') return; } }
        copyLink(url);
      });
    };
    if (!recipeId) document.getElementById('recipe').innerHTML = '<div class="status">Link de receita inválido.</div>';
    else fetch(`http://localhost:3000/receitas/publicas/${encodeURIComponent(recipeId)}`).then(response => response.ok ? response.json() : Promise.reject()).then(render).catch(() => { document.getElementById('recipe').innerHTML = '<div class="status">Esta receita não está mais disponível publicamente.</div>'; });
  </script>
</body>
</html>
